<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Keeper’s Room</title>
<style>
body{margin:0;height:100vh;overflow:hidden;background:#070b18;color:#e8d9b0;font:16px Georgia,serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.s{position:relative;height:100vh;background:radial-gradient(circle at 65% 40%,#13203a,#070b18 70%)}
.f,.w,.sp,.k,.q{pointer-events:none}
.f{position:absolute;inset:0;background:radial-gradient(circle at 30% 35%,rgba(255,255,255,.06),transparent 35%),radial-gradient(circle at 70% 60%,rgba(180,220,255,.05),transparent 40%);mix-blend-mode:screen}
.w{position:absolute;top:9%;right:10%;width:16vmin;height:23vmin;border-radius:50%/70%;background:radial-gradient(#ffd98a,#b97a1c 62%,transparent);box-shadow:0 0 80px rgba(255,190,90,.4);filter:blur(1px);animation:p 5s alternate infinite}
.b{position:absolute;top:16%;right:0;width:72vw;height:11vh;background:linear-gradient(to left,rgba(255,214,138,.22),transparent);transform-origin:right center;animation:s 8s alternate infinite}
.sp{position:absolute;left:50%;top:48%;width:min(34vmin,260px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:conic-gradient(#0b2a5a,#7fd8ff,#123a7a,#bfefff,#061a3c);box-shadow:0 0 80px rgba(127,216,255,.35),inset 0 0 60px rgba(255,255,255,.25);animation:r 14s linear infinite}
.k{position:absolute;left:14%;bottom:12%;width:14vmin;height:38vmin;background:linear-gradient(#0a0f1e,#1c2742 55%,transparent);border-radius:50%/60%;filter:blur(3px) drop-shadow(0 0 18px rgba(127,216,255,.2));opacity:.9}
.k:before{content:"";position:absolute;top:-8%;left:25%;width:50%;height:14%;border-radius:50%;background:#1a243d;filter:blur(2px)}
.q{position:absolute;bottom:6%;left:50%;transform:translateX(-50%);margin:0;letter-spacing:.12em;opacity:.78;text-shadow:0 0 12px #000}
#g{position:absolute;inset:0;display:none}
#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.h,.t{position:absolute;text-shadow:0 0 14px #000;pointer-events:none}
.h{top:18px;left:24px;letter-spacing:.14em}
.t{bottom:20px;left:50%;transform:translateX(-50%);font-size:.85rem;opacity:.7}

.btn{
  position:absolute;
  left:50%;
  top:56%;
  transform:translate(-50%, -50%);
  padding:.9em 1.7em;
  font:inherit;
  font-size:1.2rem;
  letter-spacing:.14em;
  color:#071324;
  background:linear-gradient(180deg,#dffbff,#7fd8ff);
  border:none;
  border-radius:999px;
  box-shadow:0 0 26px rgba(127,216,255,.48), inset 0 0 0 2px rgba(255,255,255,.35);
  cursor:pointer;
  z-index:10;
}

.btn:hover{
  transform:translate(-50%, -50%) scale(1.04);
}

.btn:active{
  transform:translate(-50%, -50%) scale(.97);
}

.mbtn{
  position:absolute;
  top:16px; right:18px;
  z-index:20;
  width:44px; height:44px;
  border-radius:50%;
  background:rgba(7,11,24,.55);
  color:#e8d9b0;
  border:1px solid rgba(232,217,176,.4);
  cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.mbtn:hover{ box-shadow:0 0 18px rgba(232,217,176,.3) }
.mbtn svg{ width:22px; height:22px; display:block }
.coin{opacity:.85;font-size:.92em}
.shop{position:absolute;inset:0;z-index:30;display:none;background:rgba(4,8,16,.8);backdrop-filter:blur(5px)}
.spanel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,580px);max-height:88vh;overflow-y:auto;background:linear-gradient(180deg,#0e1832,#0a1022 72%);border:1px solid rgba(232,217,176,.4);border-radius:16px;padding:46px 24px 24px;box-shadow:0 0 46px rgba(127,216,255,.2),inset 0 0 34px rgba(0,0,0,.5)}
.spanel h2{margin:.1em 0 .4em;text-align:center;letter-spacing:.18em;font-size:1.25rem;color:#ffd98a;text-shadow:0 0 16px rgba(255,217,138,.35)}
.sline{text-align:center;margin:.2em 0 1em;opacity:.85;line-height:1.5}
.cnum{color:#ffd98a}
.stabs{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.stab{font:inherit;font-size:.85rem;letter-spacing:.12em;padding:.35em 1.1em;border-radius:999px;background:transparent;color:#e8d9b0;border:1px solid rgba(232,217,176,.4);cursor:pointer}
.stab.on{background:linear-gradient(180deg,#dffbff,#7fd8ff);color:#071324;border-color:transparent;box-shadow:0 0 14px rgba(127,216,255,.4)}
.ur{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:.55em .8em;margin-bottom:.5em;border:1px solid rgba(232,217,176,.22);border-radius:10px;background:rgba(255,255,255,.03)}
.uin{display:flex;flex-direction:column;gap:2px}
.uin span{font-size:.8rem;opacity:.75;font-style:italic}
.pips{color:#ffd98a;letter-spacing:.15em;font-size:.8rem}
.sbuy{font:inherit;font-size:.82rem;padding:.4em .9em;border-radius:999px;border:none;cursor:pointer;background:linear-gradient(180deg,#ffe9b8,#d8a93f);color:#241806;letter-spacing:.06em}
.sbuy:disabled{background:rgba(255,255,255,.12);color:rgba(232,217,176,.45);cursor:default}
.sggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.scard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:.7em .4em;border-radius:12px;border:1px solid rgba(232,217,176,.22);background:rgba(255,255,255,.03);cursor:pointer;text-align:center}
.scard.eq{border-color:#ffd98a;box-shadow:0 0 14px rgba(255,217,138,.25)}
.sw{width:46px;height:46px;display:block}
.scard b{font-size:.78rem}
.scard span{font-size:.72rem;opacity:.75}
.sgo{position:static;display:block;margin:16px auto 0;transform:none;font-size:1rem;padding:.7em 1.6em}
.sgo:hover{transform:scale(1.04)}
.sgo:active{transform:scale(.97)}
.sshare{display:block;margin:.35em auto .1em;font:inherit;font-size:.72rem;letter-spacing:.14em;padding:.35em 1.3em;border-radius:999px;background:transparent;color:#e8d9b0;border:1px solid rgba(232,217,176,.4);cursor:pointer}
.sshare:hover{box-shadow:0 0 14px rgba(232,217,176,.25)}
.sreset{position:absolute;top:10px;right:12px;font:inherit;font-size:.66rem;letter-spacing:.08em;padding:.35em .85em;border-radius:999px;background:transparent;color:#e8d9b0;border:1px solid rgba(232,217,176,.35);cursor:pointer}
.sreset:hover{box-shadow:0 0 14px rgba(232,217,176,.2)}
.sreset.arm{color:#ff9d8a;border-color:rgba(255,157,138,.75);box-shadow:0 0 14px rgba(255,157,138,.3)}

@keyframes p{from{opacity:.75}to{opacity:1}}
@keyframes s{from{transform:rotate(-6deg)}to{transform:rotate(8deg)}}
@keyframes r{to{transform:translate(-50%,-50%) rotate(360deg)}}
</style>
</head>
<body>
<div class="s" id="scene">
  <div class="f"></div>
  <div class="w"></div>
  <div class="b"></div>
  <div class="sp"></div>
  <div class="k"></div>
  <p class="q">The memory turned, keeping every moment from the tide.</p>

  <button id="musicBtn" class="mbtn" title="Toggle music (M)" aria-label="Toggle background music">
    <svg class="on" viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z" fill="currentColor"/></svg>
    <svg class="off" viewBox="0 0 24 24" style="display:none"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z" fill="currentColor"/><line x1="4" y1="21" x2="20" y2="5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
  </button>

  <button id="startBtn" class="btn">Begin</button>

  <div id="shop" class="shop">
    <div class="spanel">
      <button id="resetUpg" class="sreset">Reset Upgrades</button>
      <h2>THE KEEPER'S SHOP</h2>
      <p class="sline" id="sSum"></p>
      <button id="shareBtn" class="sshare">Share Score</button>
      <div class="stabs">
        <button class="stab on" data-tab="up">Upgrades</button>
        <button class="stab" data-tab="sk">Skins</button>
      </div>
      <div id="tabUp"></div>
      <div id="tabSk" style="display:none"></div>
      <button id="shopGo" class="btn sgo">Climb Again</button>
    </div>
  </div>

  <div id="g">
    <canvas id="c"></canvas>
    <div class="h" id="u"><span id="uD">DEPTH 0</span><span class="coin" id="uC"></span><span id="uB"></span><span id="uR"></span></div>
    <div class="t" id="m">press Enter to begin</div>
  </div>
</div>
<script>
const scene = document.getElementById('scene');
const game = document.getElementById('g');
const c = document.getElementById('c');
const x = c.getContext('2d');
const u = document.getElementById('u');
const m = document.getElementById('m');
const uD = document.getElementById('uD'), uC = document.getElementById('uC'), uB = document.getElementById('uB'),
      uR = document.getElementById('uR');
const startBtn = document.getElementById('startBtn');
const elF = scene.querySelector('.f'), elW = scene.querySelector('.w'), elB = scene.querySelector('.b'),
      elSp = scene.querySelector('.sp'), elK = scene.querySelector('.k'), qEl = scene.querySelector('.q');

// ---------- Audio: Web Audio API, no external files ----------
let AC = null, sfxOut = null, musicVol = null, musicOn = true;
const mBtn = document.getElementById('musicBtn');
const mIcoOn = mBtn.querySelector('.on'), mIcoOff = mBtn.querySelector('.off');

function audioInit() {
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const master = AC.createGain();
    master.gain.value = .85;
    master.connect(AC.destination);

    sfxOut = AC.createGain();
    sfxOut.gain.value = .6;
    sfxOut.connect(master);

    musicVol = AC.createGain();
    musicVol.gain.value = musicOn ? 1 : 0;
    musicVol.connect(master);

    const bus = AC.createGain();
    MUS.bus = bus;
    bus.connect(musicVol);
    const dly = AC.createDelay(1);        // gentle echo for space
    dly.delayTime.value = .42;
    const fb = AC.createGain(), wet = AC.createGain();
    fb.gain.value = .38;
    wet.gain.value = .5;
    bus.connect(dly);
    dly.connect(fb); fb.connect(dly);
    dly.connect(wet); wet.connect(musicVol);
  }
  if (AC.state === 'suspended') AC.resume();
}

const mtof = n => 440 * Math.pow(2, (n - 69) / 12);

function tone(f0, f1, t, dur, type, vol, dest) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(Math.max(30, f0), t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(.0008, t + dur);
  o.connect(g);
  g.connect(dest || sfxOut);
  o.start(t);
  o.stop(t + dur + .05);
}

function sBounce() {
  if (!AC) return;
  const t = AC.currentTime, f = rn(430, 640);
  tone(f * 1.8, f, t, .16, 'sine', .3);
  tone(f * 3.2, f * 1.6, t, .07, 'triangle', .09);
}

function sSpring() {
  if (!AC) return;
  const t = AC.currentTime, f = rn(300, 380);
  tone(f, f * 2.7, t, .32, 'sine', .34);          // rising boing
  tone(f * 1.5, f * 3.6, t + .02, .2, 'triangle', .12);
}

function sSpeed() {
  if (!AC) return;
  const t = AC.currentTime;
  tone(240, 720, t, .5, 'sawtooth', .16);      // rising "everything quickens" sweep
  tone(360, 1080, t + .05, .4, 'triangle', .1);
}

function sShot() {
  if (!AC) return;
  const t = AC.currentTime;
  tone(880, 220, t, .16, 'square', .13);        // short pew
}

function sPower() {
  if (!AC) return;
  const t = AC.currentTime;                     // rising pickup arpeggio
  tone(520, 780, t, .12, 'triangle', .2);
  tone(660, 990, t + .09, .12, 'triangle', .2);
  tone(880, 1320, t + .18, .2, 'sine', .25);
}

function sShield() {
  if (!AC) return;
  const t = AC.currentTime;                     // barrier humming into being
  tone(320, 640, t, .3, 'sine', .18);
  tone(960, 1280, t + .08, .25, 'triangle', .1);
}

function sBlock() {
  if (!AC) return;
  const t = AC.currentTime;                     // bolt meeting the barrier
  tone(1400, 300, t, .18, 'square', .16);       // metallic clink
  tone(220, 90, t + .01, .25, 'sine', .22);     // dull thud
}

function sPop() {
  if (!AC) return;
  const t = AC.currentTime, f = rn(480, 640);   // bubble shelf deflating your boosts
  tone(f * 1.5, f * .35, t, .12, 'sine', .3);
  tone(f * 2.1, f * .7, t + .04, .1, 'triangle', .12);
}

function sGold() {
  if (!AC) return;
  const t = AC.currentTime;                     // gong-like shimmer
  tone(660, 1320, t, .3, 'triangle', .18);
  tone(990, 1980, t + .1, .35, 'sine', .14);
}

function sLose() {
  if (!AC) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain(), flt = AC.createBiquadFilter();
  flt.type = 'lowpass';
  flt.frequency.setValueAtTime(900, t);
  flt.frequency.exponentialRampToValueAtTime(120, t + .8);
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(240, t);
  o.frequency.exponentialRampToValueAtTime(52, t + .8);
  g.gain.setValueAtTime(.3, t);
  g.gain.exponentialRampToValueAtTime(.0008, t + .9);
  o.connect(flt); flt.connect(g); g.connect(sfxOut);
  o.start(t); o.stop(t + 1);
  tone(92, 46, t, .5, 'sine', .3);
}

function sStart() {
  if (!AC) return;
  const t = AC.currentTime;
  tone(660, 660, t, .3, 'sine', .2);
  tone(880, 880, t + .14, .45, 'sine', .18);
}

function sMile() {
  if (!AC) return;
  const t = AC.currentTime;
  tone(988, 988, t, .35, 'sine', .12);
  tone(1319, 1319, t + .12, .4, 'sine', .1);
}

function sTheme() {
  if (!AC) return;
  const t = AC.currentTime;                     // watery swell on entering new waters
  tone(262, 524, t, .8, 'sine', .12);
  tone(392, 784, t + .1, .7, 'triangle', .09);
}

function sCrack() {
  if (!AC) return;
  const t = AC.currentTime;                     // shelf shatters
  tone(300, 90, t, .22, 'square', .2);
  tone(1400, 500, t + .01, .1, 'triangle', .1);
}

// ---------- hints for new shelf types ----------
const HINT = '← → steer · R restart · M music';
const HINTS = {
  move:   'a shelf drifts left & right — time your bounce',
  spring: 'golden shelves fling you higher',
  lift:   'this shelf rises and falls',
  crack:  'that shelf is cracked — it breaks after one bounce',
  bubble: 'bubbly shelves — landing on one pops your boosts'
};
let seen = {}, hintT = 0;
function hint(msg) {
  m.textContent = msg;
  clearTimeout(hintT);
  hintT = setTimeout(() => { if (play) m.textContent = HINT; }, 3400);
}
function noteType(p) {
  if (p.type !== 'normal' && !seen[p.type]) { seen[p.type] = true; hint(HINTS[p.type]); }
}

// stationary ward wisps appear on shelves past depth 1000 and fire bolts at you
function maybeEnemy(p) {
  const d = -p.y / 12;
  if (d < 1000) return;
  let wispP = d > 12000 ? .5 : .25;                              // past depth 12k: double the wisp rate
  if (d > 18000) wispP = Math.min(.92, .5 + Math.floor((d - 18000) / 2000) * .1);   // +10% per 2k past 18k, capped at 92%
  if ((p.type === 'normal' || d > 18000) && Math.random() < wispP) {   // deep down, every shelf can host a wisp
    en.push({ x: p.x + rn(16, p.w - 16), y: p.y - 13, r: 9, st: 'idle', cd: rn(.4, 1.4), ch: 0 });
    if (!seenEn) { seenEn = true; hint('ward wisps fire back — keep climbing'); }
  }
}

// golden power-ups float to the left/right of shelves past depth 1000:
// grabbing one gives +50% bounce height (even on spring pads) for a while
function maybePowerup(p) {
  const d = -p.y / 12;
  if (d >= 1000 && Math.random() < .12 * luckM) {                 // Gilded Luck upgrade
    const side = Math.random() < .5 ? -1 : 1;
    const pxPos = Math.max(14, Math.min(W - 14, side === -1 ? p.x - 38 : p.x + p.w + 38));
    const kind = ['boost', 'shield', 'gold'][(Math.random() * 3) | 0];
    ups.push({ x: pxPos, y: p.y - 20, r: 10, kind });
  }
}

// --- background music: generative ambient loop (progression changes with the depth theme) ---
let EIGHTH = 60 / 74 / 2;
let CHORDS = [
  { t: [57, 60, 64], b: 45 },
  { t: [53, 57, 60], b: 41 },
  { t: [55, 60, 64], b: 48 },
  { t: [55, 59, 62], b: 43 }
];
let PADWAVE = 'triangle', PADVOL = .05, SPARKWAVE = 'sine';
const MUS = { step: 0, next: 0, started: false, bus: null };

function pad(notes, t) {
  const dur = EIGHTH * 8;
  for (const n of notes) {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = PADWAVE;
    o.frequency.value = mtof(n);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(PADVOL, t + 1.2);
    g.gain.setValueAtTime(PADVOL, t + dur - 1.4);
    g.gain.linearRampToValueAtTime(0, t + dur);
    o.connect(g);
    g.connect(MUS.bus);
    o.start(t);
    o.stop(t + dur + .1);
  }
}

function musStep(step, t) {
  const ch = CHORDS[((step / 8) | 0) % CHORDS.length];
  if (step % 8 === 0) {
    pad(ch.t, t);
    tone(mtof(ch.b), mtof(ch.b), t, EIGHTH * 7.5, 'sine', .1, MUS.bus);
  } else if (step % 2 === 0) {
    const pool = [ch.t[0] + 12, ch.t[1] + 12, ch.t[2] + 12, ch.t[2] + 24];
    const n = pool[(rn(0, 3)) | 0];
    tone(mtof(n), mtof(n), t, .5, SPARKWAVE, .07, MUS.bus);
  }
}

function musTick() {
  if (!AC) return;
  const now = AC.currentTime;
  if (MUS.next < now - .25) MUS.next = now + .08;   // resync after a stall
  while (MUS.next < now + .16) {
    musStep(MUS.step, Math.max(MUS.next, now));
    MUS.step = (MUS.step + 1) % (CHORDS.length * 8);
    MUS.next += EIGHTH;
  }
}
setInterval(musTick, 40);

function setMusic(on) {
  musicOn = on;
  mBtn.classList.toggle('off', !on);
  mIcoOn.style.display = on ? '' : 'none';
  mIcoOff.style.display = on ? 'none' : '';
  if (AC && musicVol) musicVol.gain.setTargetAtTime(on ? 1 : 0, AC.currentTime, .08);
}

mBtn.addEventListener('click', () => { audioInit(); setMusic(!musicOn); mBtn.blur(); });

// ---------- depth themes: every 2000 depth, new waters + a new synth loop ----------
const THEMES = [
  {
    name: 'the Keeper\'s Room',
    q: 'The memory turned, keeping every moment from the tide.',
    s:  'radial-gradient(circle at 65% 40%,#13203a,#070b18 70%)',
    f:  'radial-gradient(circle at 30% 35%,rgba(255,255,255,.06),transparent 35%),radial-gradient(circle at 70% 60%,rgba(180,220,255,.05),transparent 40%)',
    w:  'radial-gradient(#ffd98a,#b97a1c 62%,transparent)', ws: '0 0 80px rgba(255,190,90,.4)',
    b:  'linear-gradient(to left,rgba(255,214,138,.22),transparent)',
    sp: 'conic-gradient(#0b2a5a,#7fd8ff,#123a7a,#bfefff,#061a3c)', ss: '0 0 80px rgba(127,216,255,.35), inset 0 0 60px rgba(255,255,255,.25)',
    k:  'linear-gradient(#0a0f1e,#1c2742 55%,transparent)',
    mus: { tempo: 74, padWave: 'triangle', padVol: .05, sparkWave: 'sine', prog: [
      { t: [57, 60, 64], b: 45 }, { t: [53, 57, 60], b: 41 },
      { t: [55, 60, 64], b: 48 }, { t: [55, 59, 62], b: 43 } ] }
  },
  {
    name: 'the Ember Vault',
    q: 'Embers drift where the old fire slept.',
    s:  'radial-gradient(circle at 65% 40%,#3a1813,#180708 70%)',
    f:  'radial-gradient(circle at 30% 35%,rgba(255,180,120,.07),transparent 35%),radial-gradient(circle at 70% 60%,rgba(255,140,90,.05),transparent 40%)',
    w:  'radial-gradient(#ffb36b,#a83c14 62%,transparent)', ws: '0 0 80px rgba(255,120,60,.5)',
    b:  'linear-gradient(to left,rgba(255,150,80,.25),transparent)',
    sp: 'conic-gradient(#5a0b14,#ff9d5c,#7a1230,#ffd2a8,#3c060f)', ss: '0 0 80px rgba(255,140,80,.4), inset 0 0 60px rgba(255,255,255,.2)',
    k:  'linear-gradient(#1e0a0a,#42271c 55%,transparent)',
    mus: { tempo: 84, padWave: 'sawtooth', padVol: .036, sparkWave: 'triangle', prog: [
      { t: [56, 60, 63], b: 37 }, { t: [57, 60, 64], b: 45 },
      { t: [52, 56, 59], b: 40 }, { t: [55, 59, 62], b: 47 } ] }
  },
  {
    name: 'the Neon Tide',
    q: 'A neon tide rolls through the silent vaults.',
    s:  'radial-gradient(circle at 65% 40%,#241340,#0b0718 70%)',
    f:  'radial-gradient(circle at 30% 35%,rgba(200,150,255,.07),transparent 35%),radial-gradient(circle at 70% 60%,rgba(120,220,255,.05),transparent 40%)',
    w:  'radial-gradient(#c9a2ff,#5c1ca8 62%,transparent)', ws: '0 0 80px rgba(170,110,255,.5)',

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function genTheme(n) {   // n = tier index; stable within a run, fresh each run
  const rnd = mulberry32((runSeed + Math.imul(n, 0x9E3779B1)) | 0);
  const h = (rnd() * 360) | 0, h2 = (h + 40 + ((rnd() * 80) | 0)) % 360;
  const sat = 45 + ((rnd() * 30) | 0);
  const waves = [['sine', .048], ['triangle', .044], ['sawtooth', .034], ['square', .026]];
  const [pw, pv] = waves[(rnd() * 4) | 0];
  const base = 36 + ((rnd() * 12) | 0);                    // bass root C2–B2, chords an octave up (matches hand-crafted register)
  const sc = rnd() < .5 ? [0, 3, 5, 7, 10] : [0, 2, 4, 7, 9];   // minor / major pentatonic
  const degs = [0, 2, 3, (rnd() < .5 ? 4 : 1)];
  return {
    name: 'the ' + GEN_A[(rnd() * GEN_A.length) | 0] + ' ' + GEN_N[(rnd() * GEN_N.length) | 0],
    q: GEN_Q[(rnd() * GEN_Q.length) | 0], gen: true,

const rn = (a, b) => a + Math.random() * (b - a);

// ---------- progressive difficulty: everything scales with depth (-y / 12) ----------
function diffFor(y) {
  const d = Math.max(0, -y / 12);
  return {
    gapMin: GAP_MIN + Math.min(46, d * .55),               // gaps widen
    gapMax: GAP_MAX + Math.min(70, d * .85),
    pw:     Math.max(74, PW - Math.min(58, (d - 1) * .1)), // shelves narrow slowly now
    moveP:  Math.min(.34, Math.max(0, (d - 5) / 36)),      // drifting shelves from depth ~5
    liftP:  Math.min(.10, Math.max(0, (d - 48) / 90)),     // rising/falling shelves, deep down
    springP:d < 2 ? 0 : Math.min(.14, .05 + d * .0015),    // high-bounce shelves
    crackP: d < 500 ? 0 : Math.min(.18, .06 + (d - 500) * .0002), // fragile shelves deep down
    bubbleP:d < 6000 ? 0 : Math.min(.20, .08 + (d - 6000) * .00002), // boost-popping shelves past depth 6k
  };
}

function planType(y) {
  const d = diffFor(y);
  const r = Math.random();
  if (r < d.springP) return 'spring';
  if (r < d.springP + d.moveP + d.liftP)
    return Math.random() < d.liftP / (d.moveP + d.liftP || 1) ? 'lift' : 'move';
  if (r < d.springP + d.moveP + d.liftP + d.crackP) return 'crack';
  if (d.bubbleP > 0 && r < d.springP + d.moveP + d.liftP + d.crackP + d.bubbleP) return 'bubble';
  return 'normal';
}

function pf(x, y, type) {
  const t = type || 'normal';
  const d = diffFor(y);
  let w = d.pw;
  if (t === 'spring') w *= .78;                            // boost shelves are narrower
  const col = {
    normal: `hsl(${rn(190, 215)} 70% 62%)`,
    move:   `hsl(${rn(158, 184)} 72% 56%)`,
    lift:   `hsl(${rn(272, 300)} 72% 64%)`,
    spring: `hsl(${rn(40, 52)} 96% 62%)`,
    crack:  `hsl(${rn(208, 228)} 30% 52%)`,
    bubble: `hsla(${rn(352, 368).toFixed(0)} 85% 60% / .92)`   // red (was light blue) — boost-popping shelves
  }[t];

  let cks = null, bubs = null;
  if (t === 'crack') {                            // fissure lines so it reads at a glance
    cks = [];
    for (let i = 0; i < 3; i++) {
      const pts = [], cxp = rn(12, w - 12);
      for (let s2 = 0; s2 <= 4; s2++) pts.push([cxp + rn(-7, 7), (s2 / 4) * PH]);
      cks.push(pts);
    }
  } else if (t === 'bubble') {
    bubs = [];                                     // foamy dots baked into the shelf's glow sprite
    const nb = Math.max(3, Math.min(7, Math.round(w / 26)));
    for (let i = 0; i < nb; i++)
      bubs.push([rn(8, w - 8), rn(3.5, PH - 3.5), rn(1.6, 3.4)]);
  }

  const p = {
    x: x - w / 2, y, w, h: PH, c: col, type: t,
    baseX: x - w / 2, baseY: y,
    range: 0, vrange: 0, speed: 0, phase: rn(0, Math.PI * 2),
    prevX: x - w / 2, prevY: y, dx: 0, dy: 0,
    cks, bubs
  };
  if (t === 'move') { p.range = rn(45, 105); p.speed = rn(.9, 1.7); }
  if (t === 'lift') { p.vrange = rn(26, 48); p.speed = rn(1.1, 1.9); }
  return p;
}

function burst(a, b, n, col) {
  for (let i = 0; i < n; i++) {
    const t = rn(0, 7), v = rn(50, 240);
    pt.push({ x: a, y: b, vx: Math.cos(t) * v, vy: Math.sin(t) * v - 80, l: rn(.3, .7), m: .7, r: rn(1.5, 4), c: col });
  }
}

// tiny triangle glyph (dir: 0 up · 1 right · -1 left · 2 down)
function tri(tx, ty, dir) {
  const s = 4;
  x.beginPath();
  if (dir === 0)      { x.moveTo(tx, ty); x.lineTo(tx - s, ty + s * 1.7); x.lineTo(tx + s, ty + s * 1.7); }
  else if (dir === 2) { x.moveTo(tx, ty); x.lineTo(tx - s, ty - s * 1.7); x.lineTo(tx + s, ty - s * 1.7); }
  else if (dir > 0)   { x.moveTo(tx, ty); x.lineTo(tx - s * 1.7, ty - s); x.lineTo(tx - s * 1.7, ty + s); }
  else                { x.moveTo(tx, ty); x.lineTo(tx + s * 1.7, ty - s); x.lineTo(tx + s * 1.7, ty + s); }
  x.closePath();
  x.fill();
}

function nextPlatform(y) {
  const margin = 26;
  const minX = PW / 2 + margin;
  const maxX = W - PW / 2 - margin;

  if (maxX <= minX) {
    spawnX = W / 2;
    return pf(W / 2, y);
  }

  // Keep each new platform horizontally reachable from the previous one.
  let maxOff = Math.min(REACH, Math.max(70, (maxX - minX) / 2));
  const type = planType(y);
  if (type === 'move') maxOff -= 55;                        // reserve room for its travel

  let nx = spawnX + rn(-Math.max(40, maxOff), Math.max(40, maxOff));
  nx = Math.max(minX, Math.min(maxX, nx));

  spawnX = nx;
  const p = pf(nx, y, type);
  if (type === 'move')                                      // keep drifting shelves on screen
    p.range = Math.max(30, Math.min(p.range, p.baseX - margin, W - margin - p.baseX - p.w));
  return p;
}

function start() {
  P.x = W / 2;

  const dStart = [0, 200, 1000, 2000, 6000, 16000][S.up.depth || 0];   // Deep Descent rank: start deeper
  cam = -dStart * 12; best = dStart; mile = Math.floor(dStart / 500); gt = 0; runStart = dStart;

  const firstY = H * .78;
  P.y = cam + firstY - P.r;
  P.vx = 0;
  P.vy = B;
  runSeed = (Math.random() * 1e9) | 0; for (const k in genCache) delete genCache[k];   // fresh generative strata each climb
  setThm(Math.floor(best / 2000));                              // start the scene at your starting depth's stratum
  seen = {};
  spawnX = W / 2;
  pl = [pf(W / 2, cam + firstY)];
  pt = [];
  en = []; bj = []; ups = [];
  boost = 0; seenUp = false;
  shld = Math.min(1, S.up.ward); goldT = 0; seenShld = false; seenGold = false;           // Warding Sigil rank 1: start shielded
  revives = S.up.revive; invuln = 0;
  spdMile = 0; seenEn = false;
  upB = 1 + .08 * S.up.bounce;     // Higher Bounce
  grvM = 1 - .045 * S.up.feather;  // Featherfall
  accM = 1 + .06 * S.up.keen;      // Keen Senses
  magnetR = 70 * S.up.magnet;                          // Keeper's Magnet: pull radius for power-ups
  mendIv = S.up.ward >= 2 ? 31 - 5 * S.up.ward : 0; mendT = 0;   // Warding Sigil ranks 2–4: +1 shield every 21/16/11s
  luckM = 1 + .5 * S.up.luck;                          // Gilded Luck: power-up spawn odds
  calmM = 1 - .07 * S.up.calm;                         // Tide Calmer: slows enemy bolts
  shldCap = 1 + S.up.aegis;                             // Aegis Plating: shield holds up to 3 pellets
  goldDurM = 1 + .1 * S.up.goldx;                       // Golden Tide: +10% golden-shelf duration per rank
  fl = []; flyT = rn(2.5, 5); seenFly = false; camRate = 0;   // deep drifters (depth 6k+)
  nextY = cam + firstY;

  while (nextY > cam - H) {
    const dd = diffFor(nextY);
    nextY -= rn(dd.gapMin, dd.gapMax);
    const p = nextPlatform(nextY);
    pl.push(p);
    noteType(p);
    maybeEnemy(p);
    maybePowerup(p);
  }

  play = true;
  px = null;
  game.style.display = 'block';
  shopEl.style.display = 'none';
  startBtn.style.display = 'none';
  startBtn.blur();

  skCur = skNow();
  lastBest = -1;
  uD.textContent = 'DEPTH 0';
  uC.textContent = ' ◈ ' + S.coins.toLocaleString();
  uB.textContent = hi > 0 ? ' · BEST ' + hi.toLocaleString() : '';
  uR.textContent = revives > 0 ? ' · ✚' + revives : '';   // Second Wind: one revive left
  m.textContent = HINT;

  audioInit();
  if (!MUS.started) { MUS.started = true; MUS.next = AC.currentTime + .15; }
  sStart();
}

function end() {
  if (revives > 0) {                                       // Second Wind: rise again where you fell
    revives--; uR.textContent = '';
    bj.length = 0;                                         // clear the field so the second chance is fair
    let host = null;
    for (const p of pl) if (p.y > cam + 40 && p.y < cam + H * .8 && (!host || p.y < host.y)) host = p;
    if (host) { P.x = host.x + host.w / 2; P.y = host.y - P.r; }   // land on the highest shelf in view
    else { P.x = W / 2; P.y = cam + H * .38; }
    P.vx = 0; P.vy = B * .9;
    shld = Math.max(shld, 1);                              // arrive protected
    invuln = 2.5;                                          // brief grace while the field settles
    burst(P.x, P.y, 24, '#bfefff');
    sPower();
    hint('second wind — you refuse to sink' + (revives > 0 ? ' (' + revives + ' left)' : ''));
    return;
  }
  play = false;
  burst(P.x, P.y, 36, '#ffcf7a');
  sLose();

  // depth becomes spendable coins (Depth Lenses add a bonus); Deep Descent only pays for depth climbed this run
  const netDepth = Math.max(0, best - runStart);
  lastEarned = Math.max(1, Math.round(netDepth * (1 + .25 * S.up.lens)));
  S.coins += lastEarned;
  saveShop();

  if (best > hi) { hi = best; newBest = true; saveHi(); } else newBest = false;   // keep the all-time high score

  uD.textContent = 'LOST — DEPTH ' + best;
  uC.textContent = '';
  uB.textContent = '';
  m.textContent = 'the tide keeps what you remember';
  startBtn.style.display = 'none';
  renderShop();
  shopEl.style.display = 'block';
}

// speed multiplier grows with depth: +16% per 500-depth tier until depth 3000
// (+80%), then keeps growing uncapped at a gentler +4% per tier forever
function spdFor(d) {
  const t = d / 500;
  return t <= 6 ? 1 + Math.min(.8, t * .16) : 1.8 + (t - 6) * .04;
}

function up(dt) {
  if (!play) return;

  gt += dt;
  if (boost > 0) boost = Math.max(0, boost - dt);
  if (goldT > 0) goldT = Math.max(0, goldT - dt);
  if (invuln > 0) invuln = Math.max(0, invuln - dt);
  if (mendIv > 0 && shld < shldCap) {                              // Ward Mending: shield recharges over time
    mendT += dt;
    if (mendT >= mendIv) { mendT = 0; shld++; burst(P.x, P.y, 14, '#7fd8ff'); sShield(); }
  }

  for (const p of pl) {                                    // animate special shelves
    const ox = p.x, oy = p.y;
    if (p.type === 'move') p.x = p.baseX + Math.sin(gt * p.speed + p.phase) * p.range;
    else if (p.type === 'lift') p.y = p.baseY + Math.sin(gt * p.speed + p.phase) * p.vrange;
    p.prevX = ox; p.prevY = oy; p.dx = p.x - ox; p.dy = p.y - oy;
  }

  // every 500 depth everything gets faster (+16% per tier to depth 3000,
  // then a slower +4% per tier that never stops)
  const tier = Math.floor(best / 500);
  if (tier > spdMile) { spdMile = tier; hint('the tide quickens'); sSpeed(); }
  const sp = spdFor(best);

  const py = P.y;
  const ac = A * accM;                                  // Keen Senses upgrade
  let ax = (L ? -ac * sp : 0) + (R ? ac * sp : 0);

  if (px != null) {
    ax += Math.max(-ac * sp, Math.min(ac * sp, (px - P.x) * 18));
  }

  // frame-rate-independent damping: identical feel at 60/144/240 Hz
  P.vx = Math.max(-MV * accM, Math.min(MV * accM, (P.vx + ax * dt) * Math.pow(.92, dt * 60)));
  P.x += P.vx * dt;

  if (P.x < -P.r) P.x = W + P.r;
  if (P.x > W + P.r) P.x = -P.r;

  P.vy += G * grvM * sp * dt;
  P.vy = Math.min(P.vy, TERMINAL * sp);
  P.y += P.vy * dt;

  const t = H * .42;
  const cBef = cam;
  if (P.y < cam + t) cam += P.y - (cam + t);
  camRate += ((cBef - cam) / dt - camRate) * Math.min(1, dt * 2.5);   // smoothed upward climb speed (px/s)

  best = Math.max(best, Math.floor(-cam / 12));
  if (best !== lastBest) { lastBest = best; uD.textContent = 'DEPTH ' + best; }   // textContent beats per-frame innerHTML
  if (Math.floor(best / 500) > mile) { mile = Math.floor(best / 500); sMile(); }   // ta-ding every 500 depth

  // every 2000 depth the waters — and the music — shift to a new theme
  const ti = Math.floor(best / 2000);   // no wrap: past the last crafted scene, tiers keep generating
  if (ti !== thmIdx) { setThm(ti); sTheme(); hint('the waters shift: ' + curTheme.name); }

  while (nextY > cam - H * 1.3) {
    const dd = diffFor(nextY);
    nextY -= rn(dd.gapMin, dd.gapMax);
    const p = nextPlatform(nextY);
    pl.push(p);
    noteType(p);
    maybeEnemy(p);
    maybePowerup(p);
  }

  pl = pl.filter(p => p.y - cam < H + 220);

  // --- ward wisps: stationary turrets that fire bolts at you past depth 1000 ---
  const deepMul = best > 16000 ? 2 : 1;   // past 16k: double the charge rate AND bolt speed
  for (let i = en.length - 1; i >= 0; i--) {
    const e = en[i];
    if (e.y - cam > H + 140) { en.splice(i, 1); continue; }

    const dx2 = P.x - e.x, dy2 = P.y - e.y;
    const dist = Math.hypot(dx2, dy2);

    if (e.st === 'idle') {
      e.cd -= dt;
      if (e.cd <= 0 && dist < ERANGE) e.st = 'charge';
    } else if ((e.ch += dt * deepMul / ECHARGE) >= 1) {
      e.st = 'idle'; e.cd = rn(1.4, 2.6); e.ch = 0;
      const a = Math.atan2(dy2, dx2);
      let bspd = Math.min(BSPD * 2, BSPD + (-e.y / 12 - 1000) * .1); // bolts quicken to a 2x cap
      bspd *= deepMul * calmM;                                       // past 16k: x2 again · Tide Calmer slows them
      bj.push({ x: e.x, y: e.y - 4, vx: Math.cos(a) * bspd, vy: Math.sin(a) * bspd, r: 5 });
      sShot();
    }
  }

  // --- deep drifters: past depth 6k, hunters rise from below and follow your climb.
  // Rise = fixed base + 85% of your current climb rate, so they reliably trail behind you;
  // only an extreme vertical burst outpaces them long enough to escape. Contact is lethal (or shielded). ---
  if (best > 6000) {
    flyT -= dt;
    if (flyT <= 0) {
      flyT = Math.max(1.7, 5.2 - (best - 6000) * .0001);   // the deeper you go, the more of them
      fl.push({ x: rn(30, W - 30), y: cam + H + 60, r: 10, cd: rn(1.2, 2.4), t0: gt });
      if (!seenFly) { seenFly = true; hint('a drifter rises up behind you — it follows your climb and spits bolts'); }
    }
  }
  for (let i = fl.length - 1; i >= 0; i--) {
    const f = fl[i];
    const rise = DRIFT_BASE + DRIFT_FRAC * camRate;            // set base climb + most of your vertical speed: they follow behind
    f.y -= rise * dt;
    const want = Math.max(-135 * dt, Math.min(135 * dt, (P.x - f.x) * 1.15 * dt));  // limited homing: escapable
    f.x += want;
    if (f.y < cam - 120 || (gt - f.t0 > DRIFT_LINGER && f.y > cam + H + 280)) { fl.splice(i, 1); continue; }   // guaranteed 6s on-screen before it can fall behind
    f.cd -= dt * deepMul;                                   // past 16k they fire twice as fast too
    const fdist = Math.hypot(f.x - P.x, f.y - P.y);
    if (f.cd <= 0 && fdist < ERANGE) {                      // drifters spit aimed pellets like the ward wisps
      f.cd = rn(1.4, 2.6);
      const a = Math.atan2(P.y - f.y, P.x - f.x);
      let bspd = Math.min(BSPD * 2, BSPD + (-f.y / 12 - 1000) * .1);   // same depth scaling as turret bolts
      bspd *= deepMul * calmM;                               // past 16k: x2 again · Tide Calmer slows them
      bj.push({ x: f.x, y: f.y, vx: Math.cos(a) * bspd, vy: Math.sin(a) * bspd, r: 5 });
      sShot();
    }
    if (invuln <= 0 && Math.hypot(f.x - P.x, f.y - P.y) <= f.r + P.r) {
      if (shld > 0) { shld--; fl.splice(i, 1); burst(P.x, P.y, 20, '#7fd8ff'); sBlock(); hint(shld > 0 ? 'the shield holds — it breaks the drifter (' + shld + ' left)' : 'the shield shattered the drifter'); }
      else { end(); if (!play) break; }   // run over: stop so a second contact can't pay out again
    }
  }
  if (!play) return;   // died to a drifter this frame — shop is up, stop simulating

  for (let i = bj.length - 1; i >= 0; i--) {
    const b = bj[i];
    if (!b) continue;   // Second Wind clears the bolt list mid-iteration on a revive
    b.x += b.vx * dt; b.y += b.vy * dt;
    const sy = b.y - cam;
    if (sy < -80 || sy > H + 90 || b.x < -50 || b.x > W + 50) { bj.splice(i, 1); continue; }
    if (invuln <= 0 && Math.hypot(b.x - P.x, b.y - P.y) <= b.r + P.r) {
      if (shld > 0) {                                 // the shield eats one pellet per charge
        shld--;
        bj.splice(i, 1);
        burst(P.x, P.y, 20, '#7fd8ff');
        sBlock();
        hint(shld > 0 ? 'the shield holds — ' + shld + ' left' : 'the shield shattered');
      } else { end(); if (!play) break; }   // run over: stop so a second pellet can't pay out again
    }
  }

  // --- golden power-ups: high bounce for a while ---
  for (let i = ups.length - 1; i >= 0; i--) {
    const k = ups[i];
    if (k.y - cam > H + 80) { ups.splice(i, 1); continue; }
    if (magnetR > 0) {                                       // Keeper's Magnet: pull power-ups in
      const mdx = P.x - k.x, mdy = P.y - k.y;
      const mdist = Math.hypot(mdx, mdy);
      if (mdist < magnetR && mdist > 1) { const pull = 3.4 * dt; k.x += mdx * pull; k.y += mdy * pull; }
    }
    if (Math.hypot(k.x - P.x, k.y - P.y) <= k.r + P.r) {
      ups.splice(i, 1);
      if (k.kind === 'shield') {
        shld = Math.min(shldCap, shld + 1);
        burst(k.x, k.y, 18, '#7fd8ff');
        sShield();
        if (!seenShld) { seenShld = true; hint('shield — blocks one wisp bolt'); }
      } else if (k.kind === 'gold') {
        goldT = GOLD_DUR * goldDurM;                  // Golden Tide extends the golden rain
        burst(k.x, k.y, 20, '#ffd27a');
        sGold();
        if (!seenGold) { seenGold = true; hint('golden shelves — everything bounces higher for ' + Math.round(goldT) + 's'); }
      } else {
        boost = BOOST_DUR;
        burst(k.x, k.y, 18, '#ffd98a');
        sPower();
        if (!seenUp) { seenUp = true; hint('high bounce — 10s of extra height'); }
      }
    }
  }

  if (P.vy > 0) {
    for (let pi = 0; pi < pl.length; pi++) {
      const p = pl[pi];
      const sy = p.y - cam;
      if (sy < -40 || sy > H + 40) continue;

      const prevBottom = py + P.r;
      const newBottom = P.y + P.r;

      const topRef = Math.min(p.y, p.prevY);   // handles shelves that move vertically
      if (
        P.x + P.r > p.x &&
        P.x - P.r < p.x + p.w &&
        prevBottom <= topRef + 10 &&
        newBottom >= p.y
      ) {
        P.y = p.y - P.r;
        const springy = p.type === 'spring' || goldT > 0;   // golden shelves launch like springs
        P.vy = (springy ? SB : B) * sp * (boost > 0 ? BMULT : 1) * upB;
        if (p.dx) P.x += p.dx;                 // carried by a drifting shelf
        burst(P.x, p.y, springy ? 16 : 10, springy ? '#ffd98a' : '#9fe8ff');
        if (springy) sSpring(); else sBounce();
        if (p.type === 'crack') {              // it shatters after this one bounce
          pl.splice(pi, 1);
          burst(P.x, p.y + PH / 2, 14, '#8fa3c8');
          sCrack();
        }
        if (p.type === 'bubble' && (boost > 0 || goldT > 0)) {   // bubble shelves pop your power-ups
          boost = 0; goldT = 0;
          burst(P.x, p.y - 4, 16, '#bffcff');
          sPop();
        }
        break;
      }
    }
  }

  for (const q of pt) {
    q.vy += G * .22 * dt;
    q.x += q.vx * dt;
    q.y += q.vy * dt;
    q.l -= dt;
  }
  pt = pt.filter(q => q.l > 0);

  if (play && P.y - cam > H + 70) end();
}

// ---------- player skins ----------
function skinGlow(sk) { return sk.glow || (sk.c ? sk.c[1] : '#bfefff'); }

// detailed skin renderer — used both in-game and for the shop previews
function skinDraw(c, sk, bx, by, r, T) {
  if (T === undefined) T = gt;
  if (sk.type === 'stripes') {                          // static ROYGBIV bands clipped to the ball
    c.save();
    c.beginPath(); c.arc(bx, by, r * 1.02, 0, 7); c.clip();
    const bw = (r * 2) / ROYGBIV.length;
    for (let i = 0; i < ROYGBIV.length; i++) {
      c.fillStyle = ROYGBIV[i];
      c.fillRect(bx - r + i * bw, by - r, bw + .8, r * 2);
    }
    const hg = c.createRadialGradient(bx - r * .35, by - r * .4, 1, bx, by, r * 1.2);
    hg.addColorStop(0, 'rgba(255,255,255,.7)');
    hg.addColorStop(.4, 'rgba(255,255,255,.16)');
    hg.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = hg;
    c.fillRect(bx - r, by - r, r * 2, r * 2);
    c.restore();
    return;
  }
  if (sk.type === 'rainbow') {                          // cycles through all ROYGBIV colors
    const h = Math.round((T * 100) % 360);
    c.shadowColor = `hsl(${h} 90% 62%)`;
    const g4 = c.createRadialGradient(bx, by - r * .35, 1, bx, by, r * 1.02);
    g4.addColorStop(0, '#fff');
    g4.addColorStop(.5, `hsl(${h} 88% 72%)`);
    g4.addColorStop(1, `hsl(${h} 85% 46%)`);
    c.fillStyle = g4;
    c.beginPath(); c.arc(bx, by, r * 1.02, 0, 7); c.fill();
    return;
  }
  if (sk.type === 'strawberry') {                       // suika-style berry: red body, seeds, leaf
    const g1 = c.createRadialGradient(bx - r * .3, by - r * .4, 1, bx, by, r * 1.05);
    g1.addColorStop(0, '#ffd9de'); g1.addColorStop(.45, '#ff6b81'); g1.addColorStop(1, '#c81e3f');
    c.fillStyle = g1;
    c.beginPath(); c.arc(bx, by, r * 1.02, 0, 7); c.fill();
    c.shadowBlur = 0;
    c.fillStyle = 'rgba(255,236,150,.95)';              // seeds
    for (const [sx, sy] of [[-.42,-.18],[.34,-.34],[.55,.1],[-.12,.42],[-.58,.28],[.1,-.02],[.42,.44]]) {
      c.beginPath();
      c.ellipse(bx + sx * r, by + sy * r * .9, r * .075, r * .11, sx * 1.5, 0, 7);
      c.fill();
    }
    c.fillStyle = '#2f9e4d';                            // leaf + stem
    c.beginPath(); c.ellipse(bx - r * .32, by - r * .98, r * .4, r * .15, -.6, 0, 7); c.fill();
    c.beginPath(); c.ellipse(bx + r * .32, by - r * .98, r * .4, r * .15, .6, 0, 7); c.fill();
    c.fillStyle = '#1e7a37';
    c.fillRect(bx - r * .05, by - r * 1.28, r * .1, r * .3);
    return;
  }
  if (sk.type === 'melon') {                            // suika-style watermelon: green rind, pink flesh
    const gR = c.createRadialGradient(bx, by - r * .3, 1, bx, by, r * 1.05);
    gR.addColorStop(0, '#d9f7c8'); gR.addColorStop(.62, '#4cbf63'); gR.addColorStop(1, '#1e6b33');
    c.fillStyle = gR;
    c.beginPath(); c.arc(bx, by, r * 1.02, 0, 7); c.fill();
    c.shadowBlur = 0;
    const gI = c.createRadialGradient(bx - r * .25, by - r * .3, 1, bx, by, r * .72);
    gI.addColorStop(0, '#fff'); gI.addColorStop(.45, '#ff9db1'); gI.addColorStop(1, '#ef4d68');
    c.fillStyle = gI;
    c.beginPath(); c.arc(bx, by, r * .7, 0, 7); c.fill();
    c.fillStyle = 'rgba(40,20,30,.85)';                 // seeds
    for (const [sx, sy] of [[-.3,-.15],[.3,-.2],[-.1,.3],[.25,.28],[-.35,.25]]) {
      c.beginPath(); c.ellipse(bx + sx * r, by + sy * r, r * .06, r * .09, sx * 2, 0, 7); c.fill();
    }
    return;
  }
  if (sk.type === 'galaxy') {                           // deep orb with twinkling stars
    const g5 = c.createRadialGradient(bx - r * .3, by - r * .4, 1, bx, by, r * 1.05);
    g5.addColorStop(0, '#fff'); g5.addColorStop(.45, '#c3b2ff'); g5.addColorStop(1, '#241a5e');
    c.fillStyle = g5;
    c.beginPath(); c.arc(bx, by, r * 1.02, 0, 7); c.fill();
    c.shadowBlur = 0;
    for (let i = 0; i < GALST.length; i++) {
      const st = GALST[i];
      c.globalAlpha = .45 + .4 * Math.sin(T * 2.2 + i * 1.7);
      c.fillStyle = '#fff';
      c.beginPath();
      c.arc(bx + Math.cos(st.a) * st.d * r, by + Math.sin(st.a) * st.d * r, r * st.s, 0, 7);
      c.fill();
    }
    c.globalAlpha = 1;
    return;
  }

}

let skCur = skNow();   // cached equipped skin (avoids a per-frame find())
function drawSkin(ctx, sk, bx, by, r) { skinDraw(ctx, sk, bx, by, r); }

// ---------- perf: pre-render shadow-blurred sprites so the hot path does zero live blur passes.
// Each sprite is painted with the exact same operations as the original per-frame code, so the
// output pixels are identical — we just stop re-running an expensive Gaussian blur 15+ times a frame. ----------
const glowCache = new Map();
function mkSprite(key, w, h, paint) {
  let cv = glowCache.get(key);
  if (!cv) {
    if (glowCache.size >= 48) glowCache.delete(glowCache.keys().next().value); // FIFO: bound memory on low-end devices
    cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    paint(cv.getContext('2d'));
    glowCache.set(key, cv);
  }
  return cv;
}
const PLAT_M = 24, BALL_M = 36, BOLT_M = 16;   // measured shadow-spread margins (see blur extents)
function platSprite(col, w, blur, bubs) {
  const key = 'p' + Math.round(w * 100) + ':' + col + ':' + blur + (bubs ? ':b:' + bubs.map(b => b.join(',')).join(';') : '');
  return mkSprite(key, Math.ceil(w) + PLAT_M * 2, PH + PLAT_M * 2, g => {
    g.shadowColor = col; g.shadowBlur = blur; g.fillStyle = col;
    g.fillRect(PLAT_M, PLAT_M, w, PH);
    if (bubs) {                                     // baked bubble dots so the shelf reads as foamy
      g.shadowBlur = 0;
      for (const [bx, by, br] of bubs) {
        g.fillStyle = 'rgba(255,255,255,.22)';
        g.beginPath(); g.arc(PLAT_M + bx, PLAT_M + by, br, 0, 7); g.fill();
        g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = 1.1;
        g.beginPath(); g.arc(PLAT_M + bx, PLAT_M + by, br - .4, 0, 7); g.stroke();
      }
    }
  });
}
function ballSprite(sk) {   // exact pre-render of the live ball (glow + detailed skin), r=14
  const size = P.r * 2 + BALL_M * 2;
  return mkSprite('b:' + sk.id, size, size, g => {
    g.shadowColor = skinGlow(sk);
    g.shadowBlur = 26;
    drawSkin(g, sk, size / 2, size / 2, P.r);
  });
}
function boostBallSprite() {
  const size = P.r * 2 + BALL_M * 2, c0 = size / 2;
  return mkSprite('b:boost', size, size, g => {
    g.shadowColor = '#ffd27a';
    g.shadowBlur = 34;
    const gr = g.createRadialGradient(c0, c0 - 4, 2, c0, c0, P.r);
    gr.addColorStop(0, '#fff');
    gr.addColorStop(.55, '#ffd98a');
    gr.addColorStop(1, '#9e6b1f');
    g.fillStyle = gr;
    g.beginPath();
    g.arc(c0, c0, P.r, 0, 7);
    g.fill();
  });
}
let boltSpr = null;   // lazy: every wisp bolt looks identical

function dr() {
  x.clearRect(0, 0, W, H);

  for (const p of pl) {
    const y = p.y - cam;
    if (y < -30 || y > H + 30) continue;

    const golded = goldT > 0;
    // static shelves blit a pre-rendered glow sprite (identical pixels, no per-frame blur pass);
    // only the rare pulsing spring/golden shelves keep the live shadowBlur
    if (!lowMode && (golded || p.type === 'spring')) {
      x.save();
      x.shadowColor = golded ? '#ffd27a' : p.c;
      x.shadowBlur = 20 + Math.sin(gt * 6 + p.phase) * 8;
      x.fillStyle = golded ? '#ffd98a' : p.c;
      x.fillRect(p.x, y, p.w, p.h);
      x.restore();
    } else {
      const spr = golded ? (p.sprG || (p.sprG = platSprite('#ffd98a', p.w, 20))) : (p.spr || (p.spr = platSprite(p.c, p.w, 16, p.bubs)));
      x.drawImage(spr, p.x - PLAT_M, y - PLAT_M);
    }

    if (p.type !== 'normal') {                  // little glyphs so shelf types read at a glance
      x.save();
      const cx = p.x + p.w / 2, cy = y + PH / 2;
      if (p.type === 'move') {
        x.fillStyle = 'rgba(6,12,26,.55)';
        tri(p.x + 9, cy, -1); tri(p.x + p.w - 9, cy, 1);
      } else if (p.type === 'spring') {
        x.fillStyle = 'rgba(255,250,235,.85)';
        tri(cx, y - 4, 0);                      // up arrow: launches you
      } else if (p.type === 'lift') {
        x.fillStyle = 'rgba(6,12,26,.55)';
        tri(cx, y - 4, 0); tri(cx, y + PH + 4, 2);
      } else if (p.type === 'crack') {
        x.strokeStyle = 'rgba(8,12,22,.8)';
        x.lineWidth = 1.6;
        for (const line of p.cks) {
          x.beginPath();
          for (let i3 = 0; i3 < line.length; i3++)
            i3 ? x.lineTo(p.x + line[i3][0], y + line[i3][1]) : x.moveTo(p.x + line[i3][0], y + line[i3][1]);
          x.stroke();
        }
      }
      if (golded && p.type !== 'spring') {              // golden shelves launch like springs
        x.fillStyle = 'rgba(110,66,14,.5)';
        tri(p.x + p.w / 2, y - 4, 0);
      }
      x.restore();
    }
  }

  // ward wisps + their bolts
  for (const e of en) {
    const y = e.y - cam;
    if (y < -40 || y > H + 60) continue;

    if (e.st === 'charge') {                         // telegraph the shot
      const a2 = Math.atan2(P.y - e.y, P.x - e.x);
      x.save();
      x.strokeStyle = `rgba(255,93,143,${(.12 + e.ch * .3).toFixed(3)})`;
      x.setLineDash([6, 8]);
      x.beginPath();
      x.moveTo(e.x + Math.cos(a2) * (e.r + 5), y + Math.sin(a2) * (e.r + 5));
      x.lineTo(e.x + Math.cos(a2) * ERANGE, y + Math.sin(a2) * ERANGE);
      x.stroke();
      x.restore();
    }

    x.save();
    x.shadowColor = '#ff5d8f';
    x.shadowBlur = 14 + (e.st === 'charge' ? e.ch * 16 : Math.sin(gt * 3 + e.x) * 4);
    x.fillStyle = e.st === 'charge' ? `hsl(350 92% ${Math.round(58 + e.ch * 27)}%)` : 'hsl(350 85% 62%)';
    x.beginPath();
    x.arc(e.x, y, e.r + (e.st === 'charge' ? e.ch * 3 : 0), 0, 7);
    x.fill();
    x.restore();
  }

  // deep drifters: violet hunters with flapping wings (depth 20k+)
  for (const f of fl) {
    const y = f.y - cam;
    if (y < -50 || y > H + 90) continue;
    x.save();
    const wy = Math.sin(gt * 6 + f.x) * f.r * .3;          // wing flap
    x.shadowColor = '#b06bff';
    x.shadowBlur = 16;
    x.fillStyle = 'hsl(272 80% 64%)';
    x.beginPath(); x.ellipse(f.x, y, f.r * .85, f.r * 1.05, 0, 0, 7); x.fill();   // body
    x.fillStyle = 'hsla(272,90%,78%,.85)';
    x.beginPath();                                          // left wing
    x.moveTo(f.x - f.r * .4, y);
    x.quadraticCurveTo(f.x - f.r * 1.9, y - f.r * .8 + wy, f.x - f.r * 2.3, y + f.r * .3 + wy);
    x.quadraticCurveTo(f.x - f.r * 1.2, y + f.r * .5, f.x - f.r * .4, y + f.r * .35);
    x.closePath(); x.fill();
    x.beginPath();                                          // right wing
    x.moveTo(f.x + f.r * .4, y);
    x.quadraticCurveTo(f.x + f.r * 1.9, y - f.r * .8 + wy, f.x + f.r * 2.3, y + f.r * .3 + wy);
    x.quadraticCurveTo(f.x + f.r * 1.2, y + f.r * .5, f.x + f.r * .4, y + f.r * .35);
    x.closePath(); x.fill();
    x.shadowBlur = 0;
    x.fillStyle = '#eaffff';                                // eye
    x.beginPath(); x.arc(f.x, y - f.r * .25, f.r * .24, 0, 7); x.fill();
    x.restore();
  }

  for (const b of bj) {
    const y = b.y - cam;
    if (y < -30 || y > H + 40) continue;
    if (!boltSpr) boltSpr = mkSprite('bolt', b.r * 2 + BOLT_M * 2, b.r * 2 + BOLT_M * 2, g => {
      const c0 = BOLT_M + b.r;
      g.shadowColor = '#ffb14d';
      g.shadowBlur = 12;
      g.fillStyle = '#ffd9a8';
      g.beginPath();
      g.arc(c0, c0, b.r, 0, 7);
      g.fill();
    });
    x.drawImage(boltSpr, b.x - b.r - BOLT_M, y - b.r - BOLT_M);   // sprite center = r+M, so offset by r+M to land on (b.x, y)
  }

  // power-ups: gold diamond (high bounce), blue orb (shield), coin (golden shelves)
  for (const k of ups) {
    const y = k.y - cam;
    if (y < -30 || y > H + 40) continue;
    const r2 = k.r + Math.sin(gt * 5 + k.x) * 1.5;      // gentle pulse
    x.save();
    if (k.kind === 'shield') {
      x.shadowColor = '#4da6ff';
      x.shadowBlur = 16 + Math.sin(gt * 5 + k.x) * 6;
      const g2 = x.createRadialGradient(k.x, y - 2, 1, k.x, y, r2);
      g2.addColorStop(0, '#fff');
      g2.addColorStop(.55, '#9fdcff');
      g2.addColorStop(1, '#1f5fb3');
      x.fillStyle = g2;
      x.beginPath();
      x.arc(k.x, y, r2, 0, 7);
      x.fill();
      x.shadowBlur = 0;
      x.strokeStyle = 'rgba(214,240,255,.9)';           // barrier rim
      x.lineWidth = 2;
      x.beginPath();
      x.arc(k.x, y, r2 + 3.5, 0, 7);
      x.stroke();
    } else if (k.kind === 'gold') {
      x.shadowColor = '#ffd27a';
      x.shadowBlur = 16 + Math.sin(gt * 5 + k.x) * 6;
      const g3 = x.createRadialGradient(k.x, y - 2, 1, k.x, y, r2);
      g3.addColorStop(0, '#fff8e0');
      g3.addColorStop(.6, '#ffd98a');
      g3.addColorStop(1, '#b97a1c');
      x.fillStyle = g3;
      x.beginPath();
      x.arc(k.x, y, r2, 0, 7);
      x.fill();
      x.shadowBlur = 0;
      x.strokeStyle = 'rgba(120,74,16,.8)';             // coin rim
      x.lineWidth = 2;
      x.beginPath();
      x.arc(k.x, y, r2 - 3.5, 0, 7);
      x.stroke();
      x.fillStyle = 'rgba(255,255,255,.9)';
      x.beginPath();
      x.arc(k.x, y, 2.4, 0, 7);
      x.fill();
    } else {
      x.shadowColor = '#ffd27a';
      x.shadowBlur = 16 + Math.sin(gt * 5 + k.x) * 6;
      x.fillStyle = '#ffe9b8';
      x.beginPath();                                     // diamond
      x.moveTo(k.x, y - r2);
      x.lineTo(k.x + r2 * .7, y);
      x.lineTo(k.x, y + r2);
      x.lineTo(k.x - r2 * .7, y);
      x.closePath();
      x.fill();
      x.fillStyle = 'rgba(255,255,255,.85)';             // inner spark
      x.beginPath();
      x.arc(k.x, y, 2.6, 0, 7);
      x.fill();
    }
    x.restore();
  }

  for (const q of pt) {
    const y = q.y - cam;
    if (y < -20 || y > H + 20) continue;

    x.globalAlpha = Math.max(0, q.l / q.m);
    x.fillStyle = q.c;
    x.beginPath();
    x.arc(q.x, y, q.r, 0, 7);
    x.fill();
  }
  x.globalAlpha = 1;

  const y = P.y - cam;
  x.save();
  const sk2 = skCur;
  if (boost > 0) {                                      // boost gilds the ball over any skin
    x.drawImage(boostBallSprite(), P.x - P.r - BALL_M, y - P.r - BALL_M);   // sprite center = r+M: offset by r+M to land on (P.x, y)
  } else if (skinAnimated(sk2)) {                                      // animated skins render live so they keep cycling/twinkling
    x.shadowColor = skinGlow(sk2);
    x.shadowBlur = 26;
    drawSkin(x, sk2, P.x, y, P.r);
  } else {                                              // static skins blit a pre-rendered glow sprite (no per-frame blur pass)
    if (!sk2._spr) sk2._spr = ballSprite(sk2);
    x.drawImage(sk2._spr, P.x - P.r - BALL_M, y - P.r - BALL_M);
  }

  if (boost > 0) {                                        // timer ring while boosted
    x.strokeStyle = 'rgba(255,210,122,.8)';
    x.lineWidth = 2.5;
    x.beginPath();
    x.arc(P.x, y, P.r + 6, -Math.PI / 2, -Math.PI / 2 + (boost / BOOST_DUR) * Math.PI * 2);
    x.stroke();
  }

  if (shld > 0) {                                        // barrier ring while shielded
    x.strokeStyle = `rgba(127,216,255,${(.55 + Math.sin(gt * 4) * .2).toFixed(3)})`;
    x.lineWidth = 3;
    x.shadowColor = '#4da6ff';
    x.shadowBlur = 18;
    x.beginPath();
    x.arc(P.x, y, P.r + 10, 0, 7);
    x.stroke();
  }
  x.restore();
}

// ---------- shop UI: opens after death, spend depth coins ----------
const shopEl = document.getElementById('shop');
const sSum = document.getElementById('sSum');
const tabUp = document.getElementById('tabUp'), tabSk = document.getElementById('tabSk');
let lastEarned = 0, newBest = false, skAnims = [], lastBest = -1;

function upCost(u) { return Math.max(10, Math.round(u.base * Math.pow(u.mul, S.up[u.id]) / 10) * 10); }

function renderShop() {
  setResetArm(false);                       // fresh shop = disarmed reset button, visible on the Upgrades tab
  resetUpgBtn.style.display = '';
  sSum.innerHTML = 'Depth <b>' + best + '</b> · earned <b class="cnum">+' + lastEarned.toLocaleString() + ' ◈</b><br>Balance: <b class="cnum">' + S.coins.toLocaleString() + ' ◈</b><br>BEST: <b class="cnum">' + hi.toLocaleString() + '</b>' + (newBest ? ' — NEW BEST!' : '');
  tabUp.innerHTML = UPG.map(u => {
    const lvl = S.up[u.id], maxed = lvl >= u.max, c = upCost(u);
    return '<div class="ur"><div class="uin"><b>' + u.name + '</b><span>' + u.desc + '</span>' +
      '<i class="pips">' + '●'.repeat(Math.min(lvl, u.max)) + '○'.repeat(Math.max(0, u.max - lvl)) + '</i></div>' +
      '<button data-buy="' + u.id + '" class="sbuy"' + (maxed || S.coins < c ? ' disabled' : '') + '>' +
      (maxed ? 'MAX' : c.toLocaleString() + ' ◈') + '</button></div>';
  }).join('');
  tabSk.innerHTML = '<div class="sggrid">' + SKINS.map(sk => {
    const owned = S.skins.includes(sk.id), eq = S.skin === sk.id;
    return '<div class="scard' + (eq ? ' eq' : '') + '" data-skin="' + sk.id + '">' +
      '<canvas class="sw" width="92" height="92"></canvas><b>' + sk.name + '</b>' +
      '<span>' + (eq ? 'equipped' : owned ? 'tap to equip' : sk.cost.toLocaleString() + ' ◈') + '</span></div>';
  }).join('') + '</div>';
  // paint each preview with the exact same detailed renderer as in-game
  skAnims = [];
  tabSk.querySelectorAll('canvas.sw').forEach((cv, i) => {
    const g2c = cv.getContext('2d');
    g2c.clearRect(0, 0, 92, 92);
    g2c.shadowBlur = 0;
    skinDraw(g2c, SKINS[i], 46, 50, 30);
    if (skinAnimated(SKINS[i])) skAnims.push({ g: g2c, sk: SKINS[i] });
  });
}

// animated skins keep moving inside their shop frames while the Skins tab is open
function tickPreviews(ts) {
  if (!skAnims.length || shopEl.style.display !== 'block' || tabSk.style.display === 'none') return;
  for (const a of skAnims) {
    a.g.clearRect(0, 0, 92, 92);
    a.g.shadowBlur = 0;
    skinDraw(a.g, a.sk, 46, 50, 30, ts);
  }
}

shopEl.addEventListener('click', e => {
  const b = e.target.closest('[data-buy]');
  if (b) {
    const u = UPG.find(z => z.id === b.dataset.buy);
    if (!u || S.up[u.id] >= u.max) return;
    const c = upCost(u);
    if (S.coins < c) return;
    S.coins -= c; S.up[u.id]++; saveShop(); renderShop();
    return;
  }
  const sEl = e.target.closest('[data-skin]');
  if (!sEl) return;
  const sk = SKINS.find(z => z.id === sEl.dataset.skin);
  if (!sk) return;
  if (S.skins.includes(sk.id)) S.skin = sk.id;          // already owned: just equip
  else if (S.coins >= sk.cost) { S.coins -= sk.cost; S.skins.push(sk.id); S.skin = sk.id; }
  else return;
  skCur = sk;
  saveShop(); renderShop();
});

document.querySelectorAll('.stab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.stab').forEach(z => z.classList.toggle('on', z === t));
  const isUp = t.dataset.tab === 'up';
  tabUp.style.display = isUp ? '' : 'none';
  tabSk.style.display = isUp ? 'none' : '';
  resetUpgBtn.style.display = isUp ? '' : 'none';   // reset only lives in the Upgrades section
  setResetArm(false);
}));

document.getElementById('shopGo').addEventListener('click', () => { if (!play) start(); });

// share the high score: copies a brag line to the clipboard (with an execCommand fallback)
const shareBtn = document.getElementById('shareBtn');
function copyTxt(txt, done) {
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove(); done(ok);
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(txt).then(() => done(true), fallback);
  else fallback();
}
shareBtn.addEventListener('click', () => {
  const txt = 'I reached ' + Math.max(hi, best).toLocaleString() + ' deep in The Keeper\'s Room — how deep can you go?';
  copyTxt(txt, ok => { if (ok) { shareBtn.textContent = 'Copied ✓'; setTimeout(() => { shareBtn.textContent = 'Share Score'; }, 1400); } });
});

// reset upgrades: two-step confirm — first click arms it ("Are you sure?"), second click wipes all upgrade levels
const resetUpgBtn = document.getElementById('resetUpg');
let resetArmed = false, resetTimer = null;
function setResetArm(on) {
  resetArmed = on;
  resetUpgBtn.classList.toggle('arm', on);
  resetUpgBtn.textContent = on ? 'Are you sure?' : 'Reset Upgrades';
  clearTimeout(resetTimer);
  if (on) resetTimer = setTimeout(() => setResetArm(false), 3500);   // auto-disarms so a stale tap can't nuke upgrades later
}
resetUpgBtn.addEventListener('click', () => {
  if (!resetArmed) { setResetArm(true); return; }
  clearTimeout(resetTimer);
  for (const u of UPG) S.up[u.id] = 0;
  saveShop();
  renderShop();                             // refreshes pips/costs and re-disarms the button
});

setThm(0);
if (hi > 0) m.textContent = 'best ' + hi.toLocaleString() + ' — press Enter to begin';

function loop(t) {
  const rawDt = (t - last) / 1000;
  const dt = Math.min(rawDt, .035);
  last = t;

  // auto low-power mode: if a device can't hold ~30fps for ~2s straight, switch to the cheaper path
  if (!lowMode && isFinite(rawDt) && rawDt > 0) {
    frameEMA = frameEMA ? frameEMA * .95 + rawDt * .05 : rawDt;
    if (frameEMA > .034) { if (++slowFrames > 120) { lowMode = true; console.info("Keeper's Room: switched to low-power rendering"); } }
    else slowFrames = 0;
  }

  up(dt);
  dr();
  tickPreviews(t * .001);
  requestAnimationFrame(loop);
}

addEventListener('keydown', e => {
  if (e.key === 'Enter' && !play) start();
  if (e.key === 'r' || e.key === 'R') start();
  if (e.key === 'm' || e.key === 'M') { audioInit(); setMusic(!musicOn); }
  if (e.key === 'ArrowLeft' || e.key === 'a') L = true;
  if (e.key === 'ArrowRight' || e.key === 'd') R = true;
});

addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') L = false;
  if (e.key === 'ArrowRight' || e.key === 'd') R = false;
});

// stop long-press context menu / text-selection callout on mobile
addEventListener('contextmenu', e => e.preventDefault());

c.addEventListener('pointerdown', e => {
  if (!play) {
    start();
    return;
  }
  const r = c.getBoundingClientRect();
  px = e.clientX - r.left;
});

c.addEventListener('pointermove', e => {
  if (e.buttons > 0 || e.pointerType === 'touch') {
    const r = c.getBoundingClientRect();
    px = e.clientX - r.left;
  }
});

c.addEventListener('pointerup', () => px = null);

startBtn.addEventListener('click', () => {
  if (!play) start();
});

requestAnimationFrame(t => {
  last = t;
  loop(t);
});
</script>
</body>
