<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fruit Game — Watermelon Merge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Top HUD -->
    <header class="hud">
      <div class="hud-left">
        <button id="btnPause" class="icon-btn" title="Pause (P)" aria-label="Pause">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M8 5h3v14H8zM13 5h3v14h-3z"/></svg>
        </button>
        <button id="btnSound" class="icon-btn" title="Toggle sound (S)" aria-label="Toggle sound">
          <svg id="soundIconOn" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1c2.9.9 5 3.6 5 6.7s-2.1 5.8-5 6.7v2.1c4-.9 7-4.5 7-8.8s-3-7.9-7-8.8z"/></svg>
          <svg id="soundIconMusicOff" viewBox="0 0 24 24" width="20" height="20" style="display:none"><path fill="currentColor" d="M12 3v9.28c-.47-.17-.97-.28-1.5-.28C8.01 12 6 14.01 6 16.5S8.01 21 10.5 21c2.34 0 4.24-1.78 4.47-4.06L14 16.87V7h4V3h-6z"/><path fill="currentColor" d="M2.81 2.81 1.39 4.22l18.38 18.38 1.41-1.41L2.81 2.81z"/></svg>
          <svg id="soundIconOff" viewBox="0 0 24 24" width="20" height="20" style="display:none"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/></svg>
        </button>
        <button id="btnShake" class="icon-btn" title="Toggle screen shake" aria-label="Toggle screen shake">
          <svg id="shakeIconOn" viewBox="0 0 24 24" width="20" height="20"><rect x="9" y="5" width="6" height="14" rx="1.8" fill="currentColor"/><path stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M6 9 L3.5 7 M5 12 H1.8 M6 15 L3.5 17 M18 9 L20.5 7 M19 12 H22.2 M18 15 L20.5 17"/></svg>
          <svg id="shakeIconOff" viewBox="0 0 24 24" width="20" height="20" style="display:none"><rect x="9" y="5" width="6" height="14" rx="1.8" fill="currentColor" opacity="0.3"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 4 L20 20"/></svg>
        </button>
      </div>

      <!-- Next-fruit preview -->
      <div class="next-box" title="Next fruit">
        <span class="score-label next-label">Next</span>
        <canvas id="nextCanvas" width="48" height="48"></canvas>
      </div>

      <div class="score-panel">
        <div class="score-block">
          <span class="score-label">Score</span>
          <span id="score" class="score-value">0</span>
        </div>
        <div class="best-badge">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="#f5b301" d="M5 16L3 5l5.5 4L12 4l3.5 5L21 5l-2 11H5zm14 3a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-1h14v1z"/></svg>
          <div class="best-text">
            <span class="score-label">Best</span>
            <span id="best" class="score-value best-value">0</span>
          </div>
        </div>
      </div>

      <button id="btnRestart" class="icon-btn" title="Restart (R)" aria-label="Restart">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
      </button>
    </header>

    <!-- Game stage -->
    <div id="stage">
      <canvas id="game"></canvas>

      <!-- Combo / floating text layer is drawn on canvas; overlays below are DOM -->
      <div id="overlay" class="overlay hidden">
        <div class="overlay-card">
          <h1 id="overlayTitle">Game Over</h1>
          <p id="overlaySubtitle" class="overlay-sub"></p>
          <div class="overlay-score">
            <span class="score-label">Final Score</span>
            <span id="overlayScore" class="big-value">0</span>
          </div>
          <button id="btnPlayAgain" class="primary-btn">Play Again</button>
        </div>
      </div>

      <!-- Start splash -->
      <div id="splash" class="overlay">
        <div class="overlay-card splash-card">
          <h1 class="title-logo">Fruit<span class="logo-dot">.</span></h1>
          <p class="tagline">Drop the fruit. Match two of a kind to grow bigger.<br/>Two watermelons pop for +5000 — but don't overflow the well!</p>
          <button id="btnStart" class="primary-btn big-start">Play</button>
          <p class="hint">Drag &amp; drop with mouse or touch · P pause · S sound · R restart</p>
        </div>
      </div>
    </div>

    <footer class="foot">
      <span></span>
    </footer>
  </div>

  <script src="src/physics.js"></script>
  <script src="src/fruits.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
